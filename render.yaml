services:
  - type: web
    name: book-nishita
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.13.0
      # Email notifications: values are entered in the Render dashboard, never committed.
      # Render's free plan blocks SMTP ports 25/465/587, so use port 2525 (e.g. Brevo).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
